# Archivo legado: maquetas estáticas previas a la consola Cloudscape.
# El sitio actual se valida con cloudscape-ui-qa.yml y explanations-mode-qa.mjs.
name: Legacy slice mock visual QA (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verificar maquetas estáticas legadas
        run: node tests/slices-visual-qa.mjs
      - name: Capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-slices-visual-qa
          path: artifacts/slices-visual/
          retention-days: 14
