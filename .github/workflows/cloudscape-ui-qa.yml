name: Cloudscape prototype visual + navigation QA
on:
  push:
    branches:
      - feat/cloudscape-navegacion-slices
      - fix/roadmap-cloudscape-cache-navigation-ux
      - feature/vista-limpia-explicaciones-opcionales
      - fix/cloudscape-bundle-versionado-vista-limpia
      - feat/selector-slices-por-pantalla-sin-lateral
      - fix/agent-credentials-ui-completeness
      - feat/auditoria-integral-vistas-ux
      - fix/presentation-mode-s2-functional
      - feat/auditoria-progresion-vistas-s0-s6
      - feat/auditoria-editorial-integral-15-vistas
    paths:
      - 'assets/slices.js'
      - 'assets/slices.css'
      - 'assets/roadmap-cloudscape-v2.js'
      - 'assets/roadmap-cloudscape-v3.js'
      - 'assets/roadmap-cloudscape-v3.css'
      - 'tests/explanations-mode-qa.mjs'
      - 'assets/roadmap-cloudscape-v2.css'
      - 'tests/roadmap-v2-navigation-qa.mjs'
      - 'assets/console.html'
      - 'scripts/stamp-console-assets.mjs'
      - 'tests/console-build-integrity.mjs'
      - 'tests/screen-versions-qa.mjs'
      - 'tests/agent-credentials-qa.mjs'
      - 'assets/console-build/**'
      - 'assets/console-data.json'
      - 'index.html'
      - 'src/console/**'
      - 'tests/cloudscape-ui-qa.mjs'
      - 'tests/presentation-mode-qa.mjs'
      - 'tests/incremental-functional-qa.mjs'
      - 'tests/editorial-sweep-qa.mjs'
      - 'tests/surface-contract-qa.mjs'
      - '.github/workflows/cloudscape-ui-qa.yml'
  pull_request:
    paths:
      - 'assets/slices.js'
      - 'assets/slices.css'
      - 'assets/roadmap-cloudscape-v2.js'
      - 'assets/roadmap-cloudscape-v3.js'
      - 'assets/roadmap-cloudscape-v3.css'
      - 'tests/explanations-mode-qa.mjs'
      - 'assets/roadmap-cloudscape-v2.css'
      - 'tests/roadmap-v2-navigation-qa.mjs'
      - 'assets/console.html'
      - 'scripts/stamp-console-assets.mjs'
      - 'tests/console-build-integrity.mjs'
      - 'tests/screen-versions-qa.mjs'
      - 'tests/agent-credentials-qa.mjs'
      - 'assets/console-build/**'
      - 'assets/console-data.json'
      - 'index.html'
      - 'src/console/**'
      - 'tests/cloudscape-ui-qa.mjs'
      - 'tests/presentation-mode-qa.mjs'
      - 'tests/incremental-functional-qa.mjs'
      - 'tests/editorial-sweep-qa.mjs'
      - 'tests/surface-contract-qa.mjs'
  workflow_dispatch:
concurrency:
  group: cloudscape-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  visual-and-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser QA dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Recompilar Cloudscape desde el commit evaluado
        run: npm run build
      - name: Verificar bundle, HTML y huella de versión
        run: npm run check:assets
      - name: Verify real Cloudscape UI and navigation
        run: node tests/cloudscape-ui-qa.mjs
      - name: Verify cache isolation, navigation and accessibility of roadmap
        run: node tests/roadmap-v2-navigation-qa.mjs
      - name: Verificar modo limpio y ayuda opcional en portada y consola
        run: node tests/explanations-mode-qa.mjs
      - name: Verificar que cada pantalla tenga solo sus slices y no muestre el explorador
        run: node tests/screen-versions-qa.mjs
      - name: Verificar ciclo de credenciales de agente y aislamiento A/B
        run: node tests/agent-credentials-qa.mjs
      - name: Presentación real CON-08 · 1080p, desktop y móvil
        run: node tests/presentation-mode-qa.mjs
      - name: Evolución funcional acumulada S0-S6 y capturas de pantalla
        run: node tests/incremental-functional-qa.mjs
      - name: Auditoría editorial de las 15 versiones en escritorio y móvil
        run: node tests/editorial-sweep-qa.mjs
      - name: Contrato de superficies: catálogo, MCP, agentes y consumo
        run: node tests/surface-contract-qa.mjs
      - name: Attach screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudscape-ui-qa
          path: |
            artifacts/cloudscape-qa/
            artifacts/roadmap-v2/
            artifacts/explanations-mode/
            artifacts/screen-versions-qa/
            artifacts/agent-security-qa/
            artifacts/presentation-qa/
            artifacts/incremental-functional-qa/
            artifacts/editorial-sweep/
            artifacts/surface-contract-qa/
          retention-days: 14
