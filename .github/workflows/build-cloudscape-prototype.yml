name: Build Cloudscape interactive prototype
on:
  push:
    branches:
      - feat/cloudscape-navegacion-slices
      - feature/vista-limpia-explicaciones-opcionales
      - fix/cloudscape-bundle-versionado-vista-limpia
      - feat/selector-slices-por-pantalla-sin-lateral
      - feat/auditoria-integral-vistas-ux
      - fix/presentation-mode-s2-functional
      - feat/auditoria-progresion-vistas-s0-s6
      - fix/catalogo-modelos-multiples-y-columna-ver
    paths:
      - package.json
      - 'scripts/stamp-console-assets.mjs'
      - 'tests/console-build-integrity.mjs'
      - vite.config.mjs
      - 'src/console/**'
      - 'assets/console-data.json'
      - '.github/workflows/build-cloudscape-prototype.yml'
  workflow_dispatch:
concurrency:
  group: cloudscape-static-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias y fijar versiones
        run: npm ci --no-audit --no-fund
      - name: Sincronizar cambios de fuente antes de compilar
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --ff-only FETCH_HEAD
      - name: Crear bundle estático Cloudscape para GitHub Pages
        run: npm run build
      - name: Verificar coherencia entre bundle y HTML
        run: npm run check:assets
      - name: Validar archivos estáticos de salida
        run: |
          test -s assets/console-build/app.js
          test -s assets/console-build/app.css
          ls -lh assets/console-build/
      - name: Publicar bundle en esta rama sin tocar main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/console-build/ assets/console.html index.html package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: compilar prototipo Cloudscape para hosting estático"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
