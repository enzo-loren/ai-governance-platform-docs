<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Mapa arquitectónico AWS interactivo de AI Governance Platform desde insumo/: inferencia A, herramientas MCP B, identidad C, políticas, evidencia y consola.">
<title>Arquitectura AWS interactiva · AI Governance Platform</title>
<link rel="stylesheet" href="arquitectura-explorable.css">
</head>
<body>
<header class="appbar">
  <div class="brand"><a href="../index.html" class="back" aria-label="Volver al inicio">‹</a>
    <div><div class="eyebrow">AI GOVERNANCE PLATFORM · DISEÑO OBJETIVO · INSUMO/</div>
    <h1>Arquitectura AWS <span>explorable</span></h1></div></div>
  <div class="help"><a href="https://github.com/enzo-loren/agentic-ai-governance-platform/tree/main/insumo" target="_blank" rel="noopener">Fuente de requisitos</a></div>
</header>
<div class="toolbar" role="group" aria-label="Configuración del diagrama">
 <div class="controlset">
  <span class="staticchip" title="La conexión A siempre está presente">A <small>INFERENCIA</small> <b>✓</b></span>
  <button type="button" id="b-toggle" class="toggle b" aria-pressed="false">B <small>TOOLS MCP</small> <b aria-hidden="true">+</b></button>
  <button type="button" id="c-toggle" class="toggle c" aria-pressed="false">C <small>IDENTIDAD</small> <b aria-hidden="true">+</b></button>
 </div>
 <div class="controlset extras">
  <label class="selectwrap">Destacar
  <select id="focus-select" aria-label="Destacar un flujo">
    <option value="all">Toda la arquitectura</option>
    <option value="a">Inferencia A</option><option value="b">Ejecución MCP B</option><option value="c">Identidad C</option>
    <option value="control">Políticas y controles</option>
    <option value="evidence">Evidencia y auditoría</option>
    <option value="admin">Administración</option>
  </select></label>
  <button type="button" id="alt-toggle" class="subtle" aria-pressed="false" title="Mostrar la alternativa del spike SP-01">SP-01: alternativa</button>
  <button type="button" id="test-toggle" class="subtle" aria-pressed="false" title="Mostrar el agente de pruebas del Módulo B">Pruebas</button>
 </div>
 <div class="zoomset" role="group" aria-label="Zoom del diagrama">
  <button type="button" id="zoom-out" aria-label="Alejar">−</button><span id="zoom-label" aria-live="off">100 %</span>
  <button type="button" id="zoom-in" aria-label="Acercar">+</button>
  <button type="button" id="zoom-reset" aria-label="Reiniciar zoom">Ajustar</button>
 </div>
</div>
<main>
 <div class="frame" id="frame" tabindex="0" aria-label="Arquitectura AWS. Puedes desplazarla, acercar el zoom y seleccionar componentes para ver más detalles.">
  <svg id="map" viewBox="0 0 2800 1850" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="map-title map-desc">
   <title id="map-title">Arquitectura AWS conceptual de gobernanza de agentes</title>
   <desc id="map-desc">Mapa de una cuenta y región AWS con una puerta AgentCore Gateway, interceptores Lambda, Bedrock, DynamoDB, S3 Object Lock, consola, conexiones opcionales B y C y componentes fuera del perímetro.</desc>
  </svg>
  <div class="maphelp" id="maphelp">Arrastra para moverte · Rueda o +/− para zoom · Selecciona un bloque para inspeccionarlo</div>
 </div>
 <div class="statusline">
   <span><strong id="view-code">A</strong> <span id="view-name">Inferencia gobernada</span></span>
   <span id="view-score" aria-label="Índice de cobertura del catálogo bajo supuestos">41 % · catálogo*</span>
   <span class="legend"><i class="ink a"></i>A <i class="ink b"></i>B <i class="ink c"></i>C <i class="ink neutral"></i>soporte <i class="ink out"></i>fuera del perímetro</span>
 </div>
</main>
<script src="arquitectura-explorable.js" defer></script>
</body></html>
